[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "scilit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # Schémas et validation
  "pydantic>=2.6",
  # Corpus — téléchargement
  "requests>=2.31",
  "arxiv>=2.1",          # SDK arXiv officiel
  # Corpus — parsing PDF
  "pymupdf>=1.24",
  # NLP baseline
  "rank-bm25>=0.2",
  "nltk>=3.8",
  "spacy>=3.7",
  # Embeddings
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  # API
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  # Utilitaires
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.ruff]
line-length = 88
select = ["E","F","I","UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/scilit --cov-report=term-missing"✓
