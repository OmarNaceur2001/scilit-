[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "scilit"
version = "0.3.0"
description = "Verified literature-review assistant for NLP (course project P6)"
requires-python = ">=3.10"
# Only what the code imports. torch: install the CUDA build first (see README), then `pip install -e .`
dependencies = [
    "requests>=2.31",            # OpenAlex, arXiv, Ollama
    "pyyaml>=6.0",               # configs/themes.yaml
    "rapidfuzz>=3.0",            # fuzzy title matching
    "pymupdf>=1.24",             # PDF reading and layout
    "fasttext-wheel>=0.9.2",     # language identification (lid.176)
    "pysbd>=0.3.4",              # sentence splitting
    "numpy>=1.26",
    "pandas>=2.0",               # SciCite parquet files
    "pyarrow>=14",
    "scikit-learn>=1.3",         # TF-IDF baselines, F1
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "torch>=2.2",
    "transformers>=4.40",        # SciBERT, DeBERTa NLI
    "sentence-transformers>=2.7",# BGE-M3, bge-reranker-v2-m3
    "huggingface-hub>=0.23",     # scripts/download_models.py
    "fastapi>=0.111",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[tool.setuptools]
package-dir = {"" = "scilit/src"}

[tool.setuptools.packages.find]
where = ["scilit/src"]

[tool.ruff]
line-length = 120
