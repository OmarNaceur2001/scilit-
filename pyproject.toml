[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "scilit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "rank-bm25>=0.2",
    "nltk>=3.8",
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools]
package-dir = {"" = "scilit/src"}

[tool.setuptools.packages.find]
where = ["scilit/src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["scilit/tests"]
addopts = "--cov=scilit --cov-report=term-missing"