[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "scilit"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "pymupdf>=1.24",
    "rank-bm25>=0.2",
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "transformers>=4.40",
    "torch>=2.2",
    "scikit-learn>=1.3",
    "numpy",
    "faiss-cpu>=1.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools]
package-dir = {"" = "scilit/src"}

[tool.setuptools.packages.find]
where = ["scilit/src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["scilit/tests", "tests"]
